name: Lean 4 formal proof audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Review forbidden proof holes or custom axioms
        run: python3 scripts/check_lean_sources.py
      - name: Build Lean and Mathlib with pinned toolchain
        uses: leanprover/lean-action@v1
      - name: Check executable certificate accept/reject tests
        run: lake env lean FoldBounds/ExecutableTests.lean
      - name: Check concrete Lean HP lattice examples
        run: lake env lean FoldBounds/LatticeModelTests.lean
      - name: Compare independent Python and Lean lattice semantics
        env:
          PYTHONPATH: src
        run: python3 scripts/cross_language_diff.py
      - name: Build non-enumerative frontier checker executable
        run: lake build foldcheck
      - name: Kernel-check verified frontier examples
        run: lake env lean FoldBounds/FrontierTests.lean
      - name: Differential Python versus Lean frontier checker
        env:
          PYTHONPATH: src
        run: python3 experiments/lean_differential.py --lake-root . --runner scripts/foldcheck.lean
      - name: Quick independent compiled frontier checker benchmark
        env:
          PYTHONPATH: src
        run: python3 experiments/lean_frontier_benchmark.py --lake-root . --exe "$PWD/.lake/build/bin/foldcheck" --cases quick --exact-max 10 --out /tmp/foldbounds-lean-frontier-ci
      - name: Build version-2 frontier checker executable
        run: lake build foldcheck2
      - name: Kernel-check version-2 accepted/rejected certificates
        run: lake env lean FoldBounds/FrontierNextTests.lean
      - name: Independent exact-oracle differential and adversarial v2 checks
        timeout-minutes: 18
        env:
          PYTHONPATH: src
        run: python3 experiments/lean_v2_adversarial.py --exe2 .lake/build/bin/foldcheck2 --mutants 100 --out /tmp/foldbounds-v2-ci
      - name: Audit headline theorem axioms
        run: |
          lake env lean FoldBounds/AxiomAudit.lean | tee /tmp/foldbounds-axioms.log
          python3 scripts/check_lean_sources.py /tmp/foldbounds-axioms.log
