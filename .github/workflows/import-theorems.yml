name: One-time Aristotle theorem index import
on:
  push:
    branches: [integration/aristotle-lean-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-index:
    if: github.ref == 'refs/heads/integration/aristotle-lean-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check archive and extract exact theorem index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import lzma
          import tarfile
          parts=[Path('.theorems-staging/part'+str(i)+'.b64') for i in range(3)]
          archive=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          actual=hashlib.sha256(archive).hexdigest()
          expected='1d6734066edbb87c4bfac8fe0e232f1ee1d441e1c435c61198c0781b8556cd6f'
          if actual!=expected: raise ValueError('Unexpected theorem source SHA256: '+actual)
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(archive)),mode='r:') as t:
              files=[m for m in t.getmembers() if m.isfile()]
              if len(files)!=1 or files[0].name!='docs/THEOREMS.md':
                  raise ValueError('Unexpected theorem archive file inventory')
              Path('docs/THEOREMS.md').write_bytes(t.extractfile(files[0]).read())
          print('Imported original exact theorem index from Aristotle archive')
          PY
      - name: Commit original theorem index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/THEOREMS.md
          git rm -r .theorems-staging/ .github/workflows/import-theorems.yml
          git commit -m "Import Aristotle's original exact theorem statements" -m "Co-authored-by: Aristotle (Harmonic) <aristotle-harmonic@harmonic.fun>"
          git push origin HEAD:integration/aristotle-lean-v1
