name: Exact GNM reference-only contact case certificates

on:
  pull_request:
    paths:
      - 'src/foldbounds/gnm_joint_cases.py'
      - 'src/foldbounds/gnm_integer_updates.py'
      - 'tests/test_gnm_joint_cases.py'
      - 'tests/test_gnm_integer_updates.py'
      - 'experiments/real_1d3z_joint_cases.py'
      - 'experiments/greedy_1d3z_cases.py'
      - '.github/workflows/gnm-joint-cases-1d3z.yml'
  workflow_dispatch:

jobs:
  exact-boolean-cases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' sympy
      - name: Exact reference-only Boolean case and integer-update tests
        run: python -m pytest -q tests/test_gnm_joint_rank.py tests/test_gnm_joint_rank_real.py tests/test_gnm_integer_updates.py tests/test_gnm_joint_cases.py
      - name: Reproduce four-case exact real 1D3Z certificate
        run: python experiments/real_1d3z_joint_cases.py --epsilon 0.05 --selected-count 2 --fixed-two
      - name: Reproduce source-only eight-case reference heuristic
        run: python experiments/real_1d3z_joint_cases.py --epsilon 0.05 --selected-count 3
      - name: Reproduce completed greedy depth-three exact real 1D3Z certificate
        run: python experiments/real_1d3z_joint_cases.py --epsilon 0.05 --selected-count 3 --fixed-three
