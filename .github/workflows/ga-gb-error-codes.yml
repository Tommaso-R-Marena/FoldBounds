name: Authenticated GA95/GB95 error-correcting NMR geometry
on:
  pull_request:
    paths:
      - 'src/foldbounds/ga_gb_error_codes.py'
      - 'FoldBounds/ReporterCode.lean'
      - 'tests/test_ga_gb_error_codes.py'
      - 'experiments/ga_gb_error_code_demo.py'
      - '.github/workflows/ga-gb-error-codes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-matching-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FoldBounds tests
        run: python3 -m pip install -e '.[test]'
      - name: Test reporter-matching oracle and forged certificates
        run: python3 -m pytest -q tests/test_ga_gb_error_codes.py

  independent-real-nmr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Obtain original official RCSB NMR coordinate files
        run: |
          mkdir -p /tmp/foldbounds-real-error-code
          curl --fail --show-error --location --retry 3 --retry-delay 2 \
            --max-time 45 \
            https://files.rcsb.org/download/2KDL.pdb \
            -o /tmp/foldbounds-real-error-code/2KDL.pdb
          curl --fail --show-error --location --retry 3 --retry-delay 2 \
            --max-time 45 \
            https://files.rcsb.org/download/2KDM.pdb \
            -o /tmp/foldbounds-real-error-code/2KDM.pdb
      - name: Strict immutable provenance and coordinate hashes
        run: |
          cat >/tmp/foldbounds-real-error-code/sha256sums.txt <<'EOF'
          fb75cc55eb8b89e0cec5e2be69901b348e60916375b9c410a0573edfca1db591  /tmp/foldbounds-real-error-code/2KDL.pdb
          1c49e5faa25b443285432d935c621151294ed3b636b0106e6b1a7f7ccf2d00ec  /tmp/foldbounds-real-error-code/2KDM.pdb
          EOF
          sha256sum --check /tmp/foldbounds-real-error-code/sha256sums.txt
      - name: Install verified NMR pipeline
        run: python3 -m pip install -e '.[test]'
      - name: Independently rerun synthetic differential tests
        run: python3 -m pytest -q tests/test_ga_gb_error_codes.py
      - name: Compute authenticated 1/3/5/7/9-channel frontier and heldout results
        run: |
          python3 experiments/ga_gb_error_code_demo.py \
            --ga /tmp/foldbounds-real-error-code/2KDL.pdb \
            --gb /tmp/foldbounds-real-error-code/2KDM.pdb \
            --out /tmp/foldbounds-real-error-code/report.json
      - name: Preserve immutable derived report as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ga-gb-real-error-code-report
          path: /tmp/foldbounds-real-error-code/report.json
          retention-days: 90


  formal-reporter-soundness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed Lean proof-source scan
        run: python3 scripts/check_lean_sources.py
      - name: Build pinned Lean and Mathlib
        uses: leanprover/lean-action@v1
      - name: Kernel-check interval, majority and graph-cover theorems
        run: lake env lean FoldBounds/ReporterCode.lean | tee /tmp/reporter-axiom-audit.log
      - name: Check six exact theorem dependencies and prohibit extra axioms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('/tmp/reporter-axiom-audit.log').read_text()
          names={
            'FoldBounds.ReporterCode.shorter_band_correct',
            'FoldBounds.ReporterCode.longer_band_correct',
            'FoldBounds.ReporterCode.site_budget_implies_pair_budget',
            'FoldBounds.ReporterCode.majority_decodes',
            'FoldBounds.ReporterCode.matching_card_le_cover',
            'FoldBounds.ReporterCode.no_k_matching_if_small_cover',
          }
          found={}
          for line in log.splitlines():
            m=re.match(r"^'(FoldBounds\.ReporterCode\.[A-Za-z0-9_]+)' (.*)$",line.strip())
            if not m: continue
            name,report=m.groups()
            if name in found: raise SystemExit('duplicate theorem axiom output: '+name)
            found[name]=report
            if report=='does not depend on any axioms':continue
            if not report.startswith('depends on axioms:'):
              raise SystemExit('unknown Lean declaration report '+line)
            toks=set(re.findall(r'[A-Za-z_][A-Za-z0-9_.]*',
                                report.partition('depends on axioms:')[2]))
            bad=toks-{'Classical.choice','Quot.sound','propext'}
            if bad:raise SystemExit('unexpected axioms: '+str(sorted(bad)))
          if set(found)!=names:
            raise SystemExit('missing/extra reports: '+str(names^set(found)))
          print('Six reporter-code Lean theorems kernel checked with only standard axioms')
          PY
