name: Opt-in JEPA torch training and verifier replay
on:
  pull_request:
    paths:
      - 'src/foldbounds/jepa_*.py'
      - 'tests/test_jepa_*.py'
      - 'experiments/benchmark_jepa.py'
      - '.github/workflows/jepa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-jepa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reference checker and numpy
        run: python -m pip install -e '.[test]' numpy mdtraj
      - name: Install CPU PyTorch (optional ML experiment)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train on actual checked small-model transitions
        run: python -m pytest -q tests/test_jepa_guidance.py tests/test_jepa_trajectory.py tests/test_jepa_md_export.py
      - name: Whole-sequence holdout pilot (NO gain claim)
        run: python experiments/benchmark_jepa.py --train --rl --seed 7 --steps 3 --epochs 3
