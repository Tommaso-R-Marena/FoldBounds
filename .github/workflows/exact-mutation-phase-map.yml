name: Exact mutational phase-map certificates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install all test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check exact all-state oracle, rational bounds, and forged certificates
        run: python -m pytest -q tests/test_mutation_switch.py tests/test_mutation_switch_10.py tests/test_mutation_root.py
      - name: Isolate unique robust-majority contact thresholds exactly
        if: matrix.python-version == '3.11'
        run: |
          python experiments/certified_mutation_roots.py > /tmp/mutation-roots-recomputed.json
          python - <<'PY'
          import json
          from pathlib import Path
          from fractions import Fraction
          a=json.loads(Path('/tmp/mutation-roots-recomputed.json').read_text())
          b=json.loads(Path('experiments/certified_mutation_root_results.json').read_text())
          assert a==b
          assert [x['descartes_positive_root_sign_changes'] for x in a['results']]==[1,1]
          for x in a['results']:
              lo,hi=Fraction(x['exact_low_bracket']),Fraction(x['exact_high_bracket'])
              assert lo<hi and hi-lo<Fraction(1,10**12)
          PY
      - name: Independently enumerate all 308981 cubic self-avoiding conformations
        if: matrix.python-version == '3.11'
        run: python experiments/independent_n10_oracle.py
      - name: Rebuild and check exact ten-residue Bernstein certificate
        if: matrix.python-version == '3.11'
        run: |
          python experiments/certified_mutation_10_benchmark.py > /tmp/ten-residue-recomputed.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/ten-residue-recomputed.json').read_text())
          b=json.loads(Path('experiments/certified_mutation_10_results.json').read_text())
          assert a==b
          assert a['complete_SAW_conformations']==308981
          assert a['lossless_contact_graph_fingerprints']==1852
          from fractions import Fraction
          assert Fraction(a['original_robust_upper'])<Fraction(1,2)<Fraction(a['mutant_robust_lower'])
          PY
      - name: Reproduce all 1024 mutation edges and 1792 double-mutation cycles
        run: |
          python experiments/certified_mutation_screen.py > /tmp/foldbounds-mutation-recomputed.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/foldbounds-mutation-recomputed.json').read_text())
          b=json.loads(Path('experiments/certified_mutation_screen_results.json').read_text())
          assert a==b, 'recomputed results differ from checked-in exact source'
          assert a['anchor_oriented_conformations']==13565
          assert a['lossless_geometric_fingerprints']==171
          assert a['robust_one_site_switches_parameter_rectangle']==36
          assert a['robust_switch_reversal_orbits']==18
          assert a['undirected_one_site_edges_checked']==1024
          assert a['double_mutation_epistasis']['nonzero_exact_odds_epistasis_despite_no_direct_contact']==504
          PY
