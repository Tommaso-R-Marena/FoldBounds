name: One-time Aristotle Lean import
on:
  push:
    branches:
      - integration/aristotle-lean-v1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/integration/aristotle-lean-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import verified, allowlisted source files
        run: python3 scripts/bootstrap_aristotle.py
      - name: Commit raw Lean sources to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lean-toolchain lakefile.toml lake-manifest.json FoldBounds.lean FoldBounds/
          git rm -r .aristotle-staging .github/workflows/import-aristotle.yml scripts/bootstrap_aristotle.py
          git commit -m "Import source-verified Aristotle Lean library" -m "Co-authored-by: Aristotle (Harmonic) <aristotle-harmonic@harmonic.fun>"
          git push origin HEAD:integration/aristotle-lean-v1
