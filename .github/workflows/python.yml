name: Reference model and certificate checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Verify
        run: python -m pytest
      - name: Run reproducible reference case
        run: python -m foldbounds HHHH --q 2 --depth 4 --event-at-least 1 --exact-spectrum
      - name: Exercise matching certificate checker
        run: python -m foldbounds HHHHHHHH --q 2 --depth 2 --enhanced-lookahead 2 --matching
      - name: Compare perimeter contact bounds
        if: matrix.python-version == '3.11'
        run: python experiments/compare_isoperimetric.py
      - name: Compare adaptive search strategies
        if: matrix.python-version == '3.11'
        run: python experiments/compare_adaptive.py
      - name: Compare checked witness lower bounds
        if: matrix.python-version == '3.11'
        run: python experiments/compare_witnesses.py | tee witness_comparison.csv
      - name: Compare constructive monotone-family lower mass
        if: matrix.python-version == '3.11'
        run: python experiments/compare_monotone.py
      - name: Exercise monotone-family CLI
        run: python -m foldbounds HHHHHHHHHHHH --q 2 --enhanced-lookahead 0 --matching --transfer --monotone
      - name: Probe larger conformational spaces without an exact oracle
        if: matrix.python-version == '3.11'
        run: python experiments/scaling_witnesses.py
      - name: Exercise witness-bound certificate checker
        run: python -m foldbounds HHHHHHHH --q 2 --enhanced-lookahead 0 --matching --transfer --witness-nodes 200
      - name: Exercise weighted transfer upper bound
        run: python -m foldbounds HHHHHHHH --q 2 --enhanced-lookahead 0 --matching --transfer
      - name: Compare nested finite-memory transfer relaxations
        if: matrix.python-version == '3.11'
        run: python experiments/compare_memory_transfer.py
      - name: Compare observed recent contact pruning
        if: matrix.python-version == '3.11'
        run: python experiments/compare_recent_contact_pruning.py
      - name: Compare low-turn constructive witness families
        if: matrix.python-version == '3.11'
        run: python experiments/compare_turn_family.py
      - name: Exercise low-turn witness CLI
        run: python -m foldbounds HPHHPHHPHHHH --q 3/2 --event-at-least 2 --enhanced-lookahead 0 --matching --transfer --transfer-memory 4 --monotone --turn-family
      - name: Exercise finite-memory transfer CLI
        run: python -m foldbounds HHHHHHHHHHHH --q 2 --enhanced-lookahead 0 --matching --transfer --transfer-memory 4 --monotone
      - name: Compare transfer and perimeter relaxations
        if: matrix.python-version == '3.11'
        run: python experiments/compare_transfer.py
      - name: Exercise adaptive certificates
        run: python -m foldbounds HHHHHHHH --q 2 --adaptive-steps 8 --adaptive-policy mass --matching
      - name: Exercise enhanced certificate checker
        run: python -m foldbounds HHHHHHHH --q 2 --depth 2 --enhanced-lookahead 4
