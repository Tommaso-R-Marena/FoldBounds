name: Reference model and certificate checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Verify
        run: python -m pytest
      - name: Run reproducible reference case
        run: python -m foldbounds HHHH --q 2 --depth 4 --event-at-least 1 --exact-spectrum
      - name: Exercise matching certificate checker
        run: python -m foldbounds HHHHHHHH --q 2 --depth 2 --enhanced-lookahead 2 --matching
      - name: Compare perimeter contact bounds
        if: matrix.python-version == '3.11'
        run: python experiments/compare_isoperimetric.py
      - name: Compare adaptive search strategies
        if: matrix.python-version == '3.11'
        run: python experiments/compare_adaptive.py
      - name: Exercise weighted transfer upper bound
        run: python -m foldbounds HHHHHHHH --q 2 --enhanced-lookahead 0 --matching --transfer
      - name: Compare transfer and perimeter relaxations
        if: matrix.python-version == '3.11'
        run: python experiments/compare_transfer.py
      - name: Exercise adaptive certificates
        run: python -m foldbounds HHHHHHHH --q 2 --adaptive-steps 8 --adaptive-policy mass --matching
      - name: Exercise enhanced certificate checker
        run: python -m foldbounds HHHHHHHH --q 2 --depth 2 --enhanced-lookahead 4
