name: Mutation-invariant fold reporters + exact erasure/error audit
on:
  pull_request:
    paths:
      - 'src/foldbounds/ga_gb_mutation_safe.py'
      - 'src/foldbounds/mutation_safe_radius.py'
      - 'experiments/mutation_safe_radius_demo.py'
      - 'tests/test_mutation_safe_radius.py'
      - 'FoldBounds/MutationSafeMargins.lean'
      - 'docs/MUTATION_SAFE_ERROR_ERASURE_REPORTERS.md'
      - 'experiments/results/mutation_safe_radius_20261105.json'
      - 'experiments/mutation_safe_real_audit.py'
      - 'experiments/results/mutation_safe_real_nmr_20261105.json'
      - 'tests/test_ga_gb_mutation_safe.py'
      - 'FoldBounds/MutationSafeCodes.lean'
      - '.github/workflows/mutation-safe-codes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-and-adversarial-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FoldBounds test environment
        run: python3 -m pip install -e '.[test]'
      - name: Independently audit exact matching, mutation sites and 2t+e<k corruption theorem
        run: python3 -m pytest -q tests/test_ga_gb_mutation_safe.py tests/test_mutation_safe_radius.py

  six-structure-authenticated-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download exactly the six authenticated RCSB NMR files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foldbounds-mutation-safe
          for pdb in 2KDL 2KDM 2LHC 2LHD 2LHG 2LHE; do
            curl --fail --show-error --location --retry 3 --retry-delay 3 --max-time 50 \
              "https://files.rcsb.org/download/$pdb.pdb" \
              -o "/tmp/foldbounds-mutation-safe/$pdb.pdb"
          done
      - name: Require exact published NMR coordinate bytes, no silent replacements
        run: |
          cat >/tmp/foldbounds-mutation-safe/sha256sums.txt <<'EOF'
          fb75cc55eb8b89e0cec5e2be69901b348e60916375b9c410a0573edfca1db591  /tmp/foldbounds-mutation-safe/2KDL.pdb
          1c49e5faa25b443285432d935c621151294ed3b636b0106e6b1a7f7ccf2d00ec  /tmp/foldbounds-mutation-safe/2KDM.pdb
          91ed5cf27675f68799e60951cca5df7a4ecb2e8d19fd2063c4babb300e9507ac  /tmp/foldbounds-mutation-safe/2LHC.pdb
          73131f50fdb7fc709e0c1b3e66daf64236a19d911a4bfe5324a23007847c2e6f  /tmp/foldbounds-mutation-safe/2LHD.pdb
          946bb4d44567de7725aeecd334d7c1cec086737d6445d157cd94976326c84cff  /tmp/foldbounds-mutation-safe/2LHG.pdb
          cd2fa17ac762106c4f21c464bd7709cb612e3cd96d227ee18fdccd99608e83d1  /tmp/foldbounds-mutation-safe/2LHE.pdb
          EOF
          sha256sum --check /tmp/foldbounds-mutation-safe/sha256sums.txt
      - name: Install FoldBounds and independent adversarial tests
        run: |
          python3 -m pip install -e '.[test]'
          python3 -m pytest -q tests/test_ga_gb_mutation_safe.py
      - name: Fit only on 2KDL/2KDM, apply to all 70 independent mutant NMR structures
        run: |
          python3 -m experiments.mutation_safe_real_audit \
            --2kdl /tmp/foldbounds-mutation-safe/2KDL.pdb \
            --2kdm /tmp/foldbounds-mutation-safe/2KDM.pdb \
            --2lhc /tmp/foldbounds-mutation-safe/2LHC.pdb \
            --2lhd /tmp/foldbounds-mutation-safe/2LHD.pdb \
            --2lhg /tmp/foldbounds-mutation-safe/2LHG.pdb \
            --2lhe /tmp/foldbounds-mutation-safe/2LHE.pdb \
            --out /tmp/foldbounds-mutation-safe/new_safe_results.json
      - name: Prove six-PDB mutation-safe real-data report exactly reproduces its pinned evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('/tmp/foldbounds-mutation-safe/new_safe_results.json').read_text())
          pinned=json.loads(Path('experiments/results/mutation_safe_real_nmr_20261105.json').read_text())
          receipt=pinned.pop('verification_receipt')
          if actual!=pinned:
              raise SystemExit('mutation-safe NMR source/data result mismatch')
          if receipt["source_commit"]!="30462e4bc1967d852b2951ea0300bc23b8aeded7":
              raise SystemExit('unrecognized original pre-evaluation source revision')
          print('Mutation-safe 70-conformer 283010-trial full report reproduced exactly')
          PY
      - name: Compute exact sorted-margin geometry-noise radius for every fault budget
        run: |
          python3 -m experiments.mutation_safe_radius_demo \
            --2kdl /tmp/foldbounds-mutation-safe/2KDL.pdb \
            --2kdm /tmp/foldbounds-mutation-safe/2KDM.pdb \
            --2lhc /tmp/foldbounds-mutation-safe/2LHC.pdb \
            --2lhd /tmp/foldbounds-mutation-safe/2LHD.pdb \
            --2lhg /tmp/foldbounds-mutation-safe/2LHG.pdb \
            --2lhe /tmp/foldbounds-mutation-safe/2LHE.pdb \
            --out /tmp/foldbounds-mutation-safe/new_margin_radii.json
      - name: Prove exact order-statistic radius report reproduces immutable source result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          observed=json.loads(Path('/tmp/foldbounds-mutation-safe/new_margin_radii.json').read_text())
          reference=json.loads(Path('experiments/results/mutation_safe_radius_20261105.json').read_text())
          receipt=reference.pop('verification_receipt')
          if observed!=reference:
              raise SystemExit('mutation-safe order-statistic radii changed on exact source PDB files')
          if receipt["source_commit"]!="9b507c503a1ce0fd3dbc110ff6a99c46f7acfa34":
              raise SystemExit('wrong source run for external margin radius')
          print('All 30 exact quantile radius budgets reproduced against 70 external NMR models')
          PY
      - name: Preserve full negative controls and all per-conformer outcomes
        uses: actions/upload-artifact@v4
        with:
          name: mutation-safe-six-real-nmr-code-audit
          path: |
            /tmp/foldbounds-mutation-safe/new_safe_results.json
            /tmp/foldbounds-mutation-safe/new_margin_radii.json
          retention-days: 90


  formal-error-erasure-soundness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject untrusted proof holes and custom axioms
        run: python3 scripts/check_lean_sources.py
      - name: Build pinned Lean and Mathlib environment
        uses: leanprover/lean-action@v1
      - name: Check sharp coding error-erasure theorem in kernel
        run: lake env lean FoldBounds/MutationSafeCodes.lean | tee /tmp/mutation-code-axioms.log
      - name: Check quantile geometry margin and mixed-fault bounds
        run: lake env lean FoldBounds/MutationSafeMargins.lean | tee /tmp/mutation-margin-axioms.log
      - name: Audit six exact geometric margin theorem declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/mutation-margin-axioms.log').read_text()
          names={
              'FoldBounds.MutationSafeMargins.signed_margin_stays_correct',
              'FoldBounds.MutationSafeMargins.stable_distance_threshold',
              'FoldBounds.MutationSafeMargins.quantile_error_erasure_majority',
              'FoldBounds.MutationSafeMargins.three_source_error_budget',
              'FoldBounds.MutationSafeMargins.smaller_perturbation_inherits_certificate',
              'FoldBounds.MutationSafeMargins.quantile_limit_is_sharp',
          }
          parsed=re.findall(
              r"^'(FoldBounds\.MutationSafeMargins\.[A-Za-z0-9_]+)' "
              r"(does not depend on any axioms|depends on axioms:\s*\[[^\]]*\])",
              t,re.MULTILINE)
          seen={}
          for name,report in parsed:
              if name in seen:raise SystemExit('duplicate: '+name)
              seen[name]=report
              if 'sorryAx' in report:raise SystemExit('proof hole')
              if report.startswith('depends on axioms:'):
                  axioms=set(re.findall(r'[A-Za-z_][A-Za-z0-9_.]*',
                      report.partition('[')[2].rsplit(']',1)[0]))
                  if axioms-{'propext','Classical.choice','Quot.sound'}:
                      raise SystemExit('nonstandard axioms '+str(axioms))
          if set(seen)!=names:raise SystemExit('missing/extra margins: '+str(names^set(seen)))
          print('Six exact quantile+noise Lean declarations kernel-checked')
          PY
      - name: Audit six expected declarations and standard axiom dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/mutation-code-axioms.log').read_text()
          expected={
              'FoldBounds.MutationSafeCodes.majority_under_errors_and_erasures',
              'FoldBounds.MutationSafeCodes.site_erasure_bound_implies_channel_budget',
              'FoldBounds.MutationSafeCodes.site_loss_plus_fault_majority',
              'FoldBounds.MutationSafeCodes.bound_is_sharp_at_tie',
              'FoldBounds.MutationSafeCodes.exact_adversarial_budget',
              'FoldBounds.MutationSafeCodes.preexisting_errors_consume_budget',
          }
          logs=re.findall(
              r"^'(FoldBounds\.MutationSafeCodes\.[A-Za-z0-9_]+)' "
              r"(does not depend on any axioms|depends on axioms:\s*\[[^\]]*\])",
              t,re.MULTILINE
          )
          found={}
          for name,body in logs:
              if name in found:raise SystemExit('duplicate axiom report: '+name)
              found[name]=body
              if 'sorryAx' in body:raise SystemExit('proof hole in named theorem')
              if body.startswith('depends on axioms:'):
                  axioms=set(re.findall(r'[A-Za-z_][A-Za-z0-9_.]*',
                      body.partition('[')[2].rsplit(']',1)[0]))
                  if axioms-{'propext','Classical.choice','Quot.sound'}:
                      raise SystemExit('unexpected Lean axiom '+str(axioms))
          if set(found)!=expected:raise SystemExit('missing/extra proof declarations: '+str(expected^set(found)))
          print('Sharp mutation reporter code bound: six kernel declarations audited')
          PY
